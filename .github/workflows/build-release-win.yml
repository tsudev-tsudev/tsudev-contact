# Đẩy tag dạng `v26.8.2002` → tự build .exe trên Windows và đính vào GitHub Release.
# Chỉ chạy khi có tag mới (không chạy mỗi lần push) để tiết kiệm phút Actions của gói miễn phí.
name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # cho phép bấm chạy tay từ tab Actions

permissions:
  contents: write           # cần để tạo release và tải file lên

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Không bật `cache: pip`: repo không có requirements.txt (danh sách phụ thuộc nằm
      # trong scripts/build-win.ps1), thêm file chỉ để cache là trùng lặp không đáng.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài phụ thuộc
        run: python -m pip install --upgrade pip pillow pyinstaller

      # Runner windows-latest có phiên đồ họa nên tests/test_gui_smoke.py chạy thật ở đây.
      - name: Chạy test (gồm cả kiểm thử GUI)
        run: python -m unittest discover -s tests -v

      # Chỉ đối chiếu khi chạy theo tag; chạy tay từ tab Actions thì ref_name là tên nhánh.
      - name: Đối chiếu tag với APP_VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $appVersion = python -c "from src.app_info import APP_VERSION; print(APP_VERSION)"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $appVersion) {
            throw "Tag '$tagVersion' khác APP_VERSION '$appVersion' - sửa src/app_info.py hoặc đặt lại tag."
          }
          Write-Host "Phiên bản: $appVersion"

      # Script build tự ghi release\SHA256SUMS.txt để người tải đối chiếu.
      - name: Đóng gói bằng script phát hành
        shell: pwsh
        run: .\scripts\build-win.ps1 -SkipDeps

      - name: Lưu sản phẩm build
        uses: actions/upload-artifact@v4
        with:
          name: tsudev-contact-windows
          path: release/*

      - name: Đính vào Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem release\* | ForEach-Object FullName) --clobber
